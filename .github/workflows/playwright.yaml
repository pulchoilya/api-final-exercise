name: api tests

on:
  push:
    branches: [main]

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      url:
        description: "URL of the API to test"
        required: true
        default: "http://localhost:3000"
        type: string

      workersCount:
        description: "How many workers to use for testing"
        required: true
        default: 3
        type: number

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  test:
    env:
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      UPLOAD_DIR: ${{ vars.UPLOAD_DIR }}
      BASE_URL: ${{ github.event.inputs.url || 'http://localhost:3000' }}

    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.1

      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "9.6.0"

      - run: mysql -uroot -e 'SELECT version()'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Push schema to database
        run: npm run db:push

      - name: Seed sample data
        run: npm run db:seed

      - name: Start development server
        run: npm run dev &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run api tests
        run: npx playwright test --workers=${{ github.event.inputs.workersCount || 3 }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: tests/playwright-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the report in the job summary
        run: |
          echo "## Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
