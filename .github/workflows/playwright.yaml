name: api tests

on:
    # push:
    #     branches: [main]
    # pull_request:
    #     branches: [main]
    workflow_dispatch:
        inputs:
            url-options:
                description: "URL of the API to test"
                required: true
                default: "http://localhost:3000"
                type: choice
                options:
                    - "http://localhost:3000"
                    - "https://api.example.com"

            url:
                description: "URL of the API to test"
                required: true
                default: "http://localhost:3000"
                type: string

            isReportNeeded:
                description: "URL of the API to test"
                required: true
                default: true
                type: boolean

            workersCount:
                description: "How many workers to use for testing"
                required: true
                default: 3
                type: number

    # env:
    #     description: "URL of the API to test"
    #     required: true
    #     type: environment

jobs:
    test:
        env:
            DATABASE_URL: "mysql://root@localhost:3306/dojo_api"
            JWT_SECRET: "change-me-to-a-random-string-at-least-32-chars"
            UPLOAD_DIR: "/tmp/dojo-api-uploads"

        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.17.1

            - uses: shogo82148/actions-setup-mysql@v1
              with:
                  mysql-version: "9.6.0"
            - run: mysql -uroot -e 'SELECT version()'

            - name: Install dependencies
              run: npm install

            - name: Push schema to database
              run: npm run db:push

            - name: Seed sample data
              run: npm run db:seed

            - name: Start development server
              run: npm run dev

            - name: Run api tests
              run: npx playwright test  --workers=${{ github.event.inputs.workersCount }}

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
